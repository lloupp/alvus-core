name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test -race -coverprofile=coverage.out ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o alvus-core ./cmd/alvus-core
      - name: Python harness syntax
        run: python3 -m py_compile scripts/*.py
